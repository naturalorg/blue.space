<!--
============================================================================
BLUE SPACE — single-file build for GitHub Pages + Firebase (free Spark plan)
============================================================================

SETUP (one-time):

1. Create a Firebase project at https://console.firebase.google.com (free
   Spark plan is enough — this app deliberately never uses Firebase
   Storage, which now requires the paid Blaze plan; the gym logo is
   instead resized small and stored as a data URL directly in Firestore).
2. Authentication > Sign-in method > enable Email/Password.
3. Firestore Database > Create database > start in production mode.
4. Project settings (gear icon) > General > scroll to "Your apps" > Add app
   > Web. Copy the firebaseConfig object it gives you and paste it into
   FIREBASE_CONFIG below, replacing the placeholder values.

   This config is NOT a secret — it's meant to be public in client-side
   code. Firebase security comes from the Firestore RULES below, not from
   hiding this object. Paste it in as-is.

5. Firestore Database > Rules tab — replace the default rules with the
   block below (also included as FIRESTORE_RULES reference at the bottom
   of this comment) and click Publish.

6. Push this single index.html to a GitHub repo, then Settings > Pages >
   deploy from the branch root. That's the whole hosting step — no build,
   no npm, nothing else to upload.

7. Open the deployed page. Since no Super Admin exists yet, you'll land on
   a one-time "Create Super Admin" screen instead of the login screen —
   fill it in once and you're in. (This replaces needing a separate Node
   seed script — everything happens in the browser.)

DATA MODEL — kept relational/normalized (like SQL tables) rather than
nesting everything into a few giant documents, specifically to stay
efficient on Firestore's free-tier storage and read/write quotas:

  users        { name, email, role, createdAt }
  members      { name, email, phone, planId, planName, trainerId,
                 startDate, expiryDate, status, freezeUntil }
  plans        { name, price, hsn, durationMonths }
  ptPlans      { name, price, hsn, sessions }          (personal training)
  invoices     { number, date, memberId, memberName, planId, planName,
                 ptPlanId, ptPlanName, lineItems[], amount, gstEnabled,
                 gstRate, gstAmount, total, paymentMode, raisedBy }
  salesPipeline{ name, value, dueDate, stage }
  gymSettings/main  (single doc)  { name, address, gstin, gstEnabled, ... }
  counters/invoices (single doc)  { value }   -- atomic invoice numbering

Each collection is small and flat, referenced by id (like a foreign key)
rather than duplicated/nested — this is what keeps per-document size and
total storage down on the free plan.

FIRESTORE_RULES (paste into Firestore > Rules):

  rules_version = '2';
  service cloud.firestore {
    match /databases/{database}/documents {
      function isSignedIn() { return request.auth != null; }
      function myRole() {
        return get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role;
      }
      function isSuperAdmin() { return isSignedIn() && myRole() == "super_admin"; }
      function isStaff() { return isSignedIn() && myRole() == "staff"; }
      function isTrainer() { return isSignedIn() && myRole() == "trainer"; }

      match /users/{userId} {
        allow read: if isSignedIn() && (request.auth.uid == userId || isSuperAdmin());
        allow create: if !exists(/databases/$(database)/documents/users/$(request.auth.uid))
                       || isSuperAdmin();
        allow update, delete: if isSuperAdmin();
      }
      match /members/{id} {
        allow read: if isSuperAdmin() || isStaff() ||
          (isTrainer() && resource.data.trainerId == request.auth.uid);
        allow create, update: if isSuperAdmin() || isStaff();
        allow delete: if isSuperAdmin();
      }
      match /plans/{id} { allow read: if isSignedIn(); allow write: if isSuperAdmin(); }
      match /ptPlans/{id} { allow read: if isSignedIn(); allow write: if isSuperAdmin(); }
      match /invoices/{id} {
        allow read: if isSignedIn();
        allow create: if isSuperAdmin() || isStaff();
        allow update, delete: if isSuperAdmin();
      }
      match /counters/{id} { allow read, write: if isSuperAdmin() || isStaff(); }
      match /salesPipeline/{id} { allow read, write: if isSuperAdmin() || isStaff(); }
      match /gymSettings/{id} { allow read: if isSignedIn(); allow write: if isSuperAdmin(); }

      // Public on purpose: this is the ONLY doc anyone can read without being
      // logged in. It just answers "has a Super Admin been created yet?" so
      // the app can show the right screen (bootstrap vs. login) and check
      // that Firebase is reachable — before login, nothing else in this
      // rules file is readable, which is what a probe/bootstrap check needs
      // to work around.
      match /system/{id} { allow read: if true; allow write: if isSignedIn(); }

      // Catch-all for any new collection added in a future update that
      // isn't listed above yet — Super Admin gets access automatically,
      // so most future features won't need a rules change. Doesn't loosen
      // anything above: rules combine with OR, and staff/trainer already
      // only have exactly the access spelled out in their own match blocks.
      match /{document=**} {
        allow read, write: if isSuperAdmin();
      }
    }
  }

Firebase Storage is intentionally not used anywhere in this app (see note
above) — there are no Storage rules to configure.
============================================================================
-->

<script>
/* ============================================================
   FIREBASE CONFIG — replace with your own project's values
   (Firebase console > Project settings > Your apps > Web app)
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCG0-eF-dhsT1RpArNpZB6lyStg9Fbcdi0",
  authDomain: "blue-space-bfb76.firebaseapp.com",
  projectId: "blue-space-bfb76",
  storageBucket: "blue-space-bfb76.firebasestorage.app",
  messagingSenderId: "563819147236",
  appId: "1:563819147236:web:ac2dcf6c20eff6ad0be1f1",
};

/* ============================================================
   LOCAL-FIRST DATA LAYER
   Every read/write goes to localStorage FIRST (instant, always
   works, no network needed) and is then mirrored to Firebase in
   the background if a real project is configured and reachable.
   This is what fixes "stuck on Loading..." when opening the file
   before Firebase is set up — the app never waits on the network
   to render.
   ============================================================ */
const FIREBASE_ENABLED = FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY";
let firebaseReady = false;   // set true only after a successful reachability probe
let auth, db;

if (FIREBASE_ENABLED) {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth();
    db = firebase.firestore();
  } catch (e) {
    console.warn("Firebase initialization failed — running in local-only mode.", e);
  }
}

// Races a promise against a timeout so a hung/misconfigured Firebase call
// can never leave the app stuck on a loading screen.
function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms || 6000)),
  ]);
}

async function probeFirebase() {
  if (!auth || !db) return false;
  try {
    // Deliberately reads the public system/meta doc, NOT a protected
    // collection like "users" — those correctly require login per the
    // security rules, so probing them here would always fail (and did:
    // this was the bug behind the app always showing "Local mode" even
    // with Firebase fully and correctly configured).
    await withTimeout(db.collection("system").doc("meta").get(), 5000);
    return true;
  } catch (e) {
    console.warn("Firebase not reachable — running in local-only mode.", e.message);
    return false;
  }
}

/* ---- localStorage-backed mini "database" ---- */
const LS_PREFIX = "bs_";
const LocalStore = {
  getAll(coll){ try{ return JSON.parse(localStorage.getItem(LS_PREFIX+coll) || "[]"); }catch{ return []; } },
  setAll(coll, arr){ try{ localStorage.setItem(LS_PREFIX+coll, JSON.stringify(arr)); return true; }catch(e){ console.warn("localStorage write failed", e); return false; } },
  add(coll, doc){
    const all = this.getAll(coll);
    const id = doc.id || ("local_" + Date.now() + "_" + Math.random().toString(36).slice(2,8));
    const rec = { ...doc, id };
    all.push(rec);
    this.setAll(coll, all);
    return rec;
  },
  setDoc(coll, id, data){
    const all = this.getAll(coll);
    const idx = all.findIndex(x=>x.id===id);
    const rec = { ...data, id };
    if(idx>-1) all[idx]=rec; else all.push(rec);
    this.setAll(coll, all);
    return rec;
  },
  update(coll, id, patch){
    const all = this.getAll(coll);
    const idx = all.findIndex(x=>x.id===id);
    if(idx>-1){ all[idx] = { ...all[idx], ...patch }; this.setAll(coll, all); }
  },
  remove(coll, id){ this.setAll(coll, this.getAll(coll).filter(x=>x.id!==id)); },
  getSingleton(key){ try{ return JSON.parse(localStorage.getItem(LS_PREFIX+key) || "null"); }catch{ return null; } },
  setSingleton(key, val){ try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(val)); return true; }catch(e){ console.warn("localStorage write failed", e); return false; } },
};

/* ---- Unified data access: local first, cloud in the background ---- */
async function getCollection(name){
  if(firebaseReady){
    try{
      const snap = await withTimeout(db.collection(name).get());
      const rows = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      LocalStore.setAll(name, rows); // keep the local cache warm for next time / offline use
      return rows;
    }catch(e){
      console.warn("Cloud read failed for "+name+" — using local cache.", e);
    }
  }
  return LocalStore.getAll(name);
}
async function getMembersForTrainer(trainerId){
  if(firebaseReady){
    try{
      const snap = await withTimeout(db.collection("members").where("trainerId","==",trainerId).get());
      return snap.docs.map(d=>({ id:d.id, ...d.data() }));
    }catch(e){
      console.warn("Cloud query failed — filtering local cache instead.", e);
    }
  }
  return LocalStore.getAll("members").filter(m=>m.trainerId===trainerId);
}
async function getSingletonDoc(coll, id){
  if(firebaseReady){
    try{
      const doc = await withTimeout(db.collection(coll).doc(id).get());
      const data = doc.exists ? doc.data() : null;
      if(data) LocalStore.setSingleton(coll+"_"+id, data);
      return data || LocalStore.getSingleton(coll+"_"+id) || {};
    }catch(e){
      console.warn("Cloud read failed for "+coll+"/"+id+" — using local cache.", e);
    }
  }
  return LocalStore.getSingleton(coll+"_"+id) || {};
}
async function setSingletonDoc(coll, id, data){
  const savedLocally = LocalStore.setSingleton(coll+"_"+id, data); // local first
  if(!savedLocally){
    showToast("Couldn't save locally — storage may be full (often caused by a large logo image).");
  }
  if(firebaseReady){
    withTimeout(db.collection(coll).doc(id).set(data, { merge:true })).catch(e=>{
      console.warn("Cloud sync failed for "+coll+"/"+id+" — kept locally only.", e);
    });
  }
}
async function addDocument(coll, data){
  const rec = LocalStore.add(coll, data); // local first — usable immediately
  if(firebaseReady){
    withTimeout(db.collection(coll).add(data)).then(ref=>{
      // Reconcile the locally-generated id with Firestore's real id.
      LocalStore.remove(coll, rec.id);
      LocalStore.setDoc(coll, ref.id, data);
    }).catch(e=>{
      console.warn("Cloud sync failed for "+coll+" — kept locally only.", e);
      showToast("Saved locally — will sync to the cloud once it's reachable.");
    });
  }
  return rec;
}
async function setDocumentWithId(coll, id, data){
  const rec = LocalStore.setDoc(coll, id, data); // local first
  if(firebaseReady){
    withTimeout(db.collection(coll).doc(id).set(data, { merge:true })).catch(e=>{
      console.warn("Cloud sync failed for "+coll+"/"+id+" — kept locally only.", e);
    });
  }
  return rec;
}
async function updateDocument(coll, id, patch){
  LocalStore.update(coll, id, patch); // local first
  if(firebaseReady){
    withTimeout(db.collection(coll).doc(id).update(patch)).catch(e=>{
      console.warn("Cloud sync failed for "+coll+"/"+id+" — kept locally only.", e);
    });
  }
}
async function deleteDocument(coll, id){
  LocalStore.remove(coll, id); // local first
  if(firebaseReady){
    withTimeout(db.collection(coll).doc(id).delete()).catch(e=>{
      console.warn("Cloud sync failed for delete "+coll+"/"+id, e);
    });
  }
}

const fmtINR = (n) => '₹' + (n||0).toLocaleString('en-IN');
const todayISO = () => new Date().toISOString().slice(0,10);
const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);
// Dates are stored as ISO (YYYY-MM-DD) throughout — that's what sorts and
// does date math correctly. This only reformats them for DISPLAY.
function formatDMY(iso){
  if(!iso) return '';
  const parts = String(iso).slice(0,10).split('-');
  if(parts.length !== 3) return iso;
  const [y,m,d] = parts;
  return `${d}-${m}-${y}`;
}

/* ---------------- Firestore data access ---------------- */
async function loadAllFor(route){
  // Loads exactly what each view needs, cached on state.cache for this render pass.
  const c = state.cache;
  if(route === 'admin/summary'){
    [c.invoices, c.members, c.users] = await Promise.all([getCollection('invoices'), getCollection('members'), getCollection('users')]);
  } else if(route === 'admin/members' || route === 'staff/members'){
    [c.members, c.users, c.plans] = await Promise.all([getCollection('members'), getCollection('users'), getCollection('plans')]);
  } else if(route === 'admin/sales' || route === 'staff/sales'){
    c.salesPipeline = await getCollection('salesPipeline');
  } else if(route === 'admin/invoices'){
    [c.invoices, c.gymSettings] = await Promise.all([getCollection('invoices'), getSingletonDoc('gymSettings', 'main')]);
  } else if(route === 'admin/plans'){
    [c.plans, c.ptPlans] = await Promise.all([getCollection('plans'), getCollection('ptPlans')]);
  } else if(route === 'admin/users'){
    c.users = await getCollection('users');
  } else if(route === 'admin/settings'){
    c.gymSettings = await getSingletonDoc('gymSettings', 'main');
  } else if(route === 'staff/dashboard'){
    [c.members, c.invoices] = await Promise.all([getCollection('members'), getCollection('invoices')]);
  } else if(route === 'staff/invoices'){
    [c.members, c.plans, c.ptPlans, c.users, c.gymSettings] = await Promise.all([
      getCollection('members'), getCollection('plans'), getCollection('ptPlans'), getCollection('users'),
      getSingletonDoc('gymSettings', 'main'),
    ]);
  } else if(route === 'trainer/dashboard' || route === 'trainer/members'){
    c.myMembers = await getMembersForTrainer(state.profile.id);
  }
}

/* Auto-expire/auto-freeze — runs against the local cache first (instant),
   then pushes any changed member docs to the cloud in the background. */
async function runAutoExpireCheck(){
  const today = todayISO();
  const members = LocalStore.getAll('members');
  const changed = [];
  members.forEach(m => {
    if(m.status==='active' && m.expiryDate && m.expiryDate < today){ m.status='expired'; changed.push(m); }
    if(m.status==='frozen' && m.freezeUntil && m.freezeUntil < today){ m.status='active'; changed.push(m); }
  });
  if(changed.length){
    LocalStore.setAll('members', members);
    if(firebaseReady){
      changed.forEach(m => {
        withTimeout(db.collection('members').doc(m.id).set({ status:m.status }, { merge:true })).catch(()=>{});
      });
    }
  }
}

/* Invoice numbering: local counter first (instant, works offline), best-
   effort synced to a Firestore transaction so numbers stay unique once
   multiple devices are online at the same time. */
async function nextInvoiceNumber(){
  const key = 'counters_invoices';
  const current = LocalStore.getSingleton(key) || { value: 0 };
  const updated = { value: current.value + 1 };
  LocalStore.setSingleton(key, updated);
  const year = new Date().getFullYear();
  const number = `INV-${year}-${String(updated.value).padStart(6,'0')}`;

  if(firebaseReady){
    withTimeout(db.runTransaction(async (tx) => {
      const ref = db.collection('counters').doc('invoices');
      const snap = await tx.get(ref);
      const cloudCurrent = snap.exists ? (snap.data().value || 0) : 0;
      tx.set(ref, { value: Math.max(cloudCurrent, updated.value) }, { merge:true });
    })).catch(e => console.warn('Invoice counter cloud sync failed — kept locally only.', e));
  }
  return number;
}

/* ---------------- Auth ----------------
   Two parallel paths behind one interface (state.currentUser / state.profile):
   - "cloud" path: real Firebase Auth, used once firebaseReady is true.
   - "local" path: a lightweight fallback so the app is fully usable the
     moment you open the file, before Firebase is configured. Local-mode
     accounts live only in this browser's localStorage (password included —
     fine for local testing, not a substitute for real auth once you go
     live on Firebase).
*/
function routeForRole(role){
  return role==='super_admin' ? 'admin/summary' : role==='staff' ? 'staff/dashboard' : 'trainer/dashboard';
}
// Local mode always has one guaranteed login, so you're never locked out
// even if this browser's localStorage gets reset (e.g. opening a freshly
// re-downloaded copy of this file with a different filename/URL, which
// browsers treat as separate storage). Change these if you want, but keep
// a default — it's what the "Create Super Admin" bootstrap screen used to
// require manually every time.
const DEFAULT_ADMIN = { name: 'Adithya', email: 'adithya@business.com', password: 'business@2026', role: 'super_admin' };
function ensureDefaultAdmin(){
  const users = LocalStore.getAll('users');
  if(!users.some(u=>u.role==='super_admin')){
    LocalStore.setDoc('users', 'default-super-admin', { ...DEFAULT_ADMIN, createdAt: new Date().toISOString() });
  }
}
function fillDefaultAdmin(){
  document.getElementById('login-email').value = DEFAULT_ADMIN.email;
  document.getElementById('login-password').value = DEFAULT_ADMIN.password;
}
async function warmAndCheckExpiry(){
  await getCollection('members');   // ensure the local cache has the latest before checking
  await runAutoExpireCheck();
}
async function checkNeedsBootstrap(){
  // Same reasoning as probeFirebase: "users" requires login to read, so we
  // can't query it to decide whether a Super Admin exists yet. Instead we
  // check the public system/meta doc, which the bootstrap flow sets once
  // the first Super Admin is created.
  if(firebaseReady){
    try{
      const doc = await withTimeout(db.collection('system').doc('meta').get(), 6000);
      return !(doc.exists && doc.data().hasSuperAdmin);
    }catch(e){
      console.warn('Could not check bootstrap status from the cloud — using local cache.', e);
    }
  }
  const users = LocalStore.getAll('users');
  return !users.some(u=>u.role==='super_admin');
}

async function handleBootstrapSubmit(e){
  e.preventDefault();
  const name = document.getElementById('bs-name').value.trim();
  const email = document.getElementById('bs-email').value.trim();
  const password = document.getElementById('bs-password').value;
  const errEl = document.getElementById('bs-error');
  errEl.textContent = '';
  try{
    if(firebaseReady){
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      await setDocumentWithId('users', cred.user.uid, { name, email, role:'super_admin', createdAt:new Date().toISOString() });
      await setDocumentWithId('system', 'meta', { hasSuperAdmin: true });
      // initCloudAuth's onAuthStateChanged listener picks this up from here.
    } else {
      const rec = LocalStore.add('users', { name, email, password, role:'super_admin', createdAt:new Date().toISOString() });
      LocalStore.setSingleton('session', { userId: rec.id });
      state.currentUser = { uid: rec.id, isLocal:true };
      state.profile = { id: rec.id, name, email, role:'super_admin' };
      state.route = 'admin/summary';
      await loadRoute();
    }
  }catch(err){
    errEl.textContent = err.message || 'Could not create the account.';
  }
}

// Logs in via the built-in local session — works regardless of whether
// Firebase is configured, reachable, or has Email/Password sign-in turned
// on yet. Used for the guaranteed default admin, and as the fallback path
// whenever Firebase itself isn't ready to authenticate anyone.
async function loginLocally(email, password){
  const users = LocalStore.getAll('users');
  const u = users.find(x=>x.email.toLowerCase()===email.toLowerCase() && x.password===password);
  if(!u) throw new Error('Invalid email or password.');
  LocalStore.setSingleton('session', { userId: u.id });
  state.currentUser = { uid: u.id, isLocal:true };
  state.profile = { id: u.id, name:u.name, email:u.email, role:u.role };
  await warmAndCheckExpiry();
  state.route = routeForRole(u.role);
  await loadRoute();
}

async function handleLogin(e){
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';

  const isDefaultAdmin = email.toLowerCase() === DEFAULT_ADMIN.email.toLowerCase() && password === DEFAULT_ADMIN.password;

  if(isDefaultAdmin && firebaseReady){
    // Once Firebase is actually reachable, the default admin needs to
    // become a REAL authenticated account rather than staying on the local
    // bypass — a local session has no genuine Firebase Auth token behind
    // it, and Firestore correctly refuses writes (like creating other
    // users' profile docs) without one. This provisions it for real the
    // first time it's used after Firebase comes online, then logs in
    // normally from then on.
    try{
      await auth.signInWithEmailAndPassword(email, password);
      return; // onAuthStateChanged takes it from here
    }catch(signInErr){
      if(signInErr.code === 'auth/user-not-found'){
        try{
          const cred = await auth.createUserWithEmailAndPassword(email, password);
          await setDocumentWithId('users', cred.user.uid, { name: DEFAULT_ADMIN.name, email, role:'super_admin', createdAt:new Date().toISOString() });
          await setDocumentWithId('system', 'meta', { hasSuperAdmin: true });
          return; // onAuthStateChanged takes it from here
        }catch(provisionErr){
          console.warn('Could not provision the default admin as a real cloud account — using the local session instead.', provisionErr);
        }
      } else {
        console.warn('Default admin cloud sign-in failed — using the local session instead.', signInErr);
      }
    }
  }

  if(isDefaultAdmin){
    ensureDefaultAdmin();
    try{ await loginLocally(email, password); }catch(err){ errEl.textContent = err.message; }
    return;
  }

  try{
    if(firebaseReady){
      await auth.signInWithEmailAndPassword(email, password);
    } else {
      await loginLocally(email, password);
    }
  }catch(err){
    // If Firebase can't authenticate anyone yet (Email/Password provider
    // not enabled in the console — auth/configuration-not-found — or any
    // other auth error), fall back to checking the local account list
    // instead of just showing a raw Firebase error.
    try{ await loginLocally(email, password); }
    catch{ errEl.textContent = 'Invalid email or password.'; }
  }
}

function handleLogout(){
  // A local-bypass session (like the default admin before it's provisioned
  // as a real cloud account) has no real Firebase Auth session behind it —
  // calling auth.signOut() in that case is a no-op (nothing to sign out of
  // from Firebase's perspective), so onAuthStateChanged never fires and the
  // UI never updates. Check for that case first, regardless of firebaseReady.
  if(state.currentUser && state.currentUser.isLocal){
    LocalStore.setSingleton('session', null);
    state.currentUser = null; state.profile = null; state.route = 'login';
    loadRoute();
  } else if(firebaseReady){
    auth.signOut();
  } else {
    LocalStore.setSingleton('session', null);
    state.currentUser = null; state.profile = null; state.route = 'login';
    render();
  }
}

function initCloudAuth(){
  auth.onAuthStateChanged(async (user) => {
    state.authResolved = false;
    try{
      if(user){
        let profileData = null;
        try{
          const doc = await withTimeout(db.collection('users').doc(user.uid).get(), 6000);
          profileData = doc.exists ? doc.data() : null;
          if(profileData) LocalStore.setDoc('users', user.uid, profileData);
        }catch(e){
          console.warn('Could not reach Firestore for the profile — using local cache.', e);
          profileData = LocalStore.getAll('users').find(u=>u.id===user.uid) || null;
        }
        if(!profileData){
          await auth.signOut();
          state.currentUser = null; state.profile = null;
        } else {
          state.currentUser = user;
          state.profile = { id: user.uid, ...profileData };
          await warmAndCheckExpiry();
          state.route = routeForRole(state.profile.role);
        }
      } else {
        state.currentUser = null; state.profile = null;
        ensureDefaultAdmin(); // guarantees a working login regardless of Firebase's auth state
        state.needsBootstrap = false; // login is always the entry point — the default admin gets you in
        state.route = 'login';
      }
    } finally {
      state.authResolved = true;
      await loadRoute();
    }
  });
}

async function initLocalAuth(){
  state.authResolved = false;
  try{
    ensureDefaultAdmin(); // guarantees adithya@business.com always works
    const users = LocalStore.getAll('users');
    const session = LocalStore.getSingleton('session');
    const sessionUser = session ? users.find(u=>u.id===session.userId) : null;
    if(sessionUser){
      state.currentUser = { uid: sessionUser.id, isLocal:true };
      state.profile = { id: sessionUser.id, name:sessionUser.name, email:sessionUser.email, role:sessionUser.role };
      await warmAndCheckExpiry();
      state.route = routeForRole(sessionUser.role);
    } else {
      state.currentUser = null; state.profile = null;
      state.needsBootstrap = false; // local mode always has the default admin — no bootstrap needed
      state.route = 'login';
    }
  } finally {
    state.authResolved = true;
    await loadRoute();
  }
}

async function boot(){
  applyTheme();
  render(); // shows the loading state immediately — never blocks on network
  if(FIREBASE_ENABLED){
    firebaseReady = await probeFirebase();
  }
  if(firebaseReady) initCloudAuth();
  else await initLocalAuth();
}

/* ---------------- Reusable "DataTable": search + sort + pagination ---------------- */
const PAGE_SIZE = 8;
function tableState(key){
  if(!state.tables[key]) state.tables[key] = { query:'', sortKey:null, sortDir:'asc', page:1 };
  return state.tables[key];
}
function dataTableHTML(key, columns, rows, searchKeys){
  const t = tableState(key);
  let filtered = rows;
  if(t.query.trim()){
    const q = t.query.toLowerCase();
    filtered = rows.filter(r => searchKeys.some(k => String(r[k]??'').toLowerCase().includes(q)));
  }
  if(t.sortKey){
    filtered = [...filtered].sort((a,b) => {
      const av=a[t.sortKey]??'', bv=b[t.sortKey]??'';
      if(typeof av==='number' && typeof bv==='number') return t.sortDir==='asc' ? av-bv : bv-av;
      return t.sortDir==='asc' ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
    });
  }
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if(t.page > totalPages) t.page = totalPages;
  const pageRows = filtered.slice((t.page-1)*PAGE_SIZE, t.page*PAGE_SIZE);

  return `
  ${searchKeys.length ? `
  <div class="search-wrap">
    ${ICONS.search}
    <input class="input" placeholder="Search…" value="${t.query}" oninput="tableState('${key}').query=this.value; tableState('${key}').page=1; render();" />
  </div>` : ''}
  <div style="overflow-x:auto;">
    <table>
      <thead><tr>
        ${columns.map(c=>`
          <th class="${c.sortable?'sortable':''}" ${c.sortable?`onclick="sortTable('${key}','${c.key}')"`:''}>
            ${c.label} ${c.sortable && t.sortKey===c.key ? (t.sortDir==='asc'?ICONS.chevUp:ICONS.chevDown) : ''}
          </th>`).join('')}
      </tr></thead>
      <tbody>
        ${pageRows.map(row => `<tr>${columns.map(c=>`<td>${c.render ? c.render(row) : (row[c.key] ?? '')}</td>`).join('')}</tr>`).join('') ||
          `<tr><td colspan="${columns.length}" class="empty-state">No records.</td></tr>`}
      </tbody>
    </table>
  </div>
  ${totalPages > 1 ? `
  <div class="row-between" style="margin-top:14px;margin-bottom:0;">
    <span class="muted">Page ${t.page} of ${totalPages} · ${filtered.length} results</span>
    <div style="display:flex;gap:6px;">
      <button class="btn-secondary" style="padding:6px 12px;font-size:12px;" ${t.page===1?'disabled':''} onclick="tableState('${key}').page--; render();">Prev</button>
      <button class="btn-secondary" style="padding:6px 12px;font-size:12px;" ${t.page===totalPages?'disabled':''} onclick="tableState('${key}').page++; render();">Next</button>
    </div>
  </div>` : ''}`;
}
function sortTable(key, col){
  const t = tableState(key);
  if(t.sortKey === col) t.sortDir = t.sortDir === 'asc' ? 'desc' : 'asc';
  else { t.sortKey = col; t.sortDir = 'asc'; }
  render();
}

/* ---------------- Membership expiry buckets ---------------- */
function expiryBuckets(members){
  const ranges = [
    { label:'Expiring today', min:0, max:0, bg:'var(--danger-bg)', fg:'var(--danger)' },
    { label:'Next 3 days', min:1, max:3, bg:'var(--danger-bg)', fg:'var(--danger)' },
    { label:'Next 7 days', min:4, max:7, bg:'var(--warn-bg)', fg:'var(--warn)' },
    { label:'Next 15 days', min:8, max:15, bg:'var(--a-orange-bg)', fg:'var(--a-orange)' },
    { label:'Next 30 days', min:16, max:30, bg:'var(--a-blue-bg)', fg:'var(--a-blue)' },
  ];
  const today = todayISO();
  return ranges.map(r => ({
    ...r,
    members: members.filter(m => {
      if(m.status==='expired' || !m.expiryDate) return false;
      const diff = daysBetween(today, m.expiryDate);
      return diff>=r.min && diff<=r.max;
    }),
  }));
}

/* ---------------- Real chart aggregation from Firestore data ---------------- */
function lastNMonths(n){
  const out = [];
  const d = new Date();
  d.setDate(1);
  for(let i=n-1;i>=0;i--){
    const dt = new Date(d.getFullYear(), d.getMonth()-i, 1);
    out.push({ year: dt.getFullYear(), month: dt.getMonth(), label: dt.toLocaleString('en-US',{month:'short'}) });
  }
  return out;
}
function monthKeyOf(dateStr){
  const d = new Date(dateStr);
  return `${d.getFullYear()}-${d.getMonth()}`;
}
function buildChartData(invoices, members, users){
  const months = lastNMonths(6);
  const revenueByMonth = {}, membersByMonth = {}, trainersByMonth = {};
  months.forEach(m => { revenueByMonth[`${m.year}-${m.month}`]=0; membersByMonth[`${m.year}-${m.month}`]=0; trainersByMonth[`${m.year}-${m.month}`]=0; });

  invoices.forEach(inv => {
    if(!inv.date) return;
    const key = monthKeyOf(inv.date);
    if(key in revenueByMonth) revenueByMonth[key] += (inv.total||0);
  });
  members.forEach(m => {
    if(!m.startDate) return;
    const key = monthKeyOf(m.startDate);
    if(key in membersByMonth) membersByMonth[key] += 1;
  });
  users.filter(u=>u.role==='trainer').forEach(u => {
    if(!u.createdAt) return;
    const key = monthKeyOf(u.createdAt);
    if(key in trainersByMonth) trainersByMonth[key] += 1;
  });

  const revenue = months.map(m => revenueByMonth[`${m.year}-${m.month}`]);
  const growth = revenue.map((v,i) => {
    if(i===0) return 0;
    const prev = revenue[i-1];
    return prev === 0 ? (v>0?100:0) : Math.round(((v-prev)/prev)*100);
  });
  return {
    labels: months.map(m=>m.label),
    revenue,
    growth,
    membersJoined: months.map(m => membersByMonth[`${m.year}-${m.month}`]),
    trainersJoined: months.map(m => trainersByMonth[`${m.year}-${m.month}`]),
  };
}

async function handleAddUser(e){
  e.preventDefault();
  const name = document.getElementById('uf-name').value;
  const email = document.getElementById('uf-email').value.trim();
  const password = document.getElementById('uf-password').value;
  const role = document.getElementById('uf-role').value;
  const errEl = document.getElementById('uf-error');
  errEl.textContent = '';
  try{
    if(firebaseReady){
      try{
        // Create the account on a secondary, throwaway Firebase app instance so
        // the admin creating this user doesn't get signed out of their own
        // session (createUserWithEmailAndPassword signs in as the new user on
        // whichever auth instance you call it on).
        const secondaryApp = firebase.initializeApp(FIREBASE_CONFIG, 'secondary-' + Date.now());
        const cred = await secondaryApp.auth().createUserWithEmailAndPassword(email, password);
        await setDocumentWithId('users', cred.user.uid, { name, email, role, createdAt: new Date().toISOString() });
        await secondaryApp.auth().signOut();
        await secondaryApp.delete();
        showToast('User created.');
      }catch(cloudErr){
        // Most common cause: Email/Password sign-in isn't turned on yet in
        // Firebase Authentication (auth/configuration-not-found). Rather
        // than block on that, create a working local-only account instead
        // — it logs in immediately in this browser; once Email/Password is
        // enabled in the console, recreate it to get a real synced account.
        console.warn('Cloud user creation failed — creating a local-only account instead.', cloudErr);
        LocalStore.add('users', { name, email, password, role, createdAt: new Date().toISOString() });
        showToast("Created as a local-only account — enable Email/Password sign-in in Firebase to sync it to the cloud.");
      }
    } else {
      // Local-only mode: no real Firebase Auth account to create, so the
      // password is stored alongside the record for the local login check.
      LocalStore.add('users', { name, email, password, role, createdAt: new Date().toISOString() });
      showToast('User created.');
    }
    await loadRoute();
  }catch(err){
    errEl.textContent = err.message || 'Could not create user.';
  }
}

const BACKUP_COLLECTIONS = ['members','plans','ptPlans','invoices','users','salesPipeline'];
function handleExportBackup(){
  const backup = { exportedAt: new Date().toISOString() };
  BACKUP_COLLECTIONS.forEach(c => { backup[c] = LocalStore.getAll(c); });
  backup.gymSettings = LocalStore.getSingleton('gymSettings_main') || {};
  backup.counters_invoices = LocalStore.getSingleton('counters_invoices') || { value: 0 };

  const blob = new Blob([JSON.stringify(backup, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `blue-space-backup-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
async function handleImportBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const backup = JSON.parse(text);

    for(const coll of BACKUP_COLLECTIONS){
      const rows = Array.isArray(backup[coll]) ? backup[coll] : [];
      for(const row of rows){
        const { id, ...data } = row;
        if(id) await setDocumentWithId(coll, id, data);
        else await addDocument(coll, data);
      }
    }
    if(backup.gymSettings) await setSingletonDoc('gymSettings', 'main', backup.gymSettings);
    if(backup.counters_invoices) LocalStore.setSingleton('counters_invoices', backup.counters_invoices);

    showToast('Backup restored.');
    await loadRoute();
  }catch(err){
    console.warn('Could not restore backup.', err);
    showToast('Could not read that backup file.');
  }
  e.target.value = '';
}
function handleToggleGst(){
  state.cache.gymSettings = state.cache.gymSettings || {};
  state.cache.gymSettings.gstEnabled = !state.cache.gymSettings.gstEnabled;
  render();

// Downscales an image file to a small PNG data URL before storing it in
// localStorage — an uncompressed photo can be several MB as a data URL,
// which either blows past the ~5-10MB localStorage quota (silently, unless
// checked) or makes every save/load of gymSettings sluggish. A logo only
// ever needs to render at a few dozen pixels, so 240px is plenty.
function resizeImageToDataURL(file, maxDim){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > height){ if(width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; } }
        else { if(height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
// The logo is intentionally NOT stored in Firebase Storage — as of late
// 2024, Cloud Storage for Firebase requires the paid Blaze plan, even
// though Blaze itself has a free quota. To keep this app fully on the
// free Spark plan, the logo is resized down small and stored as a data
// URL directly inside the gymSettings document in Firestore instead —
// well within Firestore's 1MiB document size limit at this size.
async function handleLogoUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const dataUrl = await resizeImageToDataURL(file, 240);
    state.cache.gymSettings = state.cache.gymSettings || {};
    state.cache.gymSettings.logoUrl = dataUrl;
    document.getElementById('logo-preview').innerHTML = `<img src="${dataUrl}"/>`;
  }catch(err){
    console.warn('Could not process the logo image.', err);
    showToast('Could not read that image — try a different file.');
  }
}

    <div class="card stat-card"><div><p class="lbl">Total members</p><p class="val">${members.length}</p></div><div class="stat-icon" style="background:var(--a-blue-bg);color:var(--a-blue);">${ICONS.users}</div></div>
    <div class="card stat-card"><div><p class="lbl">Invoices raised</p><p class="val">${invoices.length}</p></div><div class="stat-icon" style="background:var(--a-purple-bg);color:var(--a-purple);">${ICONS.receipt}</div></div>

/* ---------------- Staff: Generate Invoice ---------------- */
function viewGenerateInvoice(){
  const g = state.cache.gymSettings || {};
  const members = state.cache.members || [];
  const plans = state.cache.plans || [];
  const ptPlans = state.cache.ptPlans || [];
  const trainers = (state.cache.users || []).filter(u=>u.role==='trainer');

  return `
  <div class="grid" style="grid-template-columns:1fr 1fr;align-items:start;">
    <form class="card" onsubmit="handleGenerateInvoice(event)" style="display:flex;flex-direction:column;gap:14px;">
      <h2 class="section-title">${ICONS.receipt} New invoice</h2>

      <div class="pill-tabs">
        <button type="button" class="pill-tab ${state.invoiceMode==='existing'?'active':''}" onclick="state.invoiceMode='existing'; render();">Existing member</button>
        <button type="button" class="pill-tab ${state.invoiceMode==='new'?'active':''}" onclick="state.invoiceMode='new'; render();">New member</button>
      </div>
      <p class="muted" style="margin-top:-6px;">
        ${state.invoiceMode==='new' ? "Enter their details here — generating the invoice adds them to Members automatically." : "Generating renews this member's plan and updates their expiry in Members automatically."}
      </p>

      ${state.invoiceMode==='existing' ? `
        <div><label class="label">Member</label>
          <select class="input" id="gi-member" required>
            <option value="">Select member</option>
            ${members.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}
          </select>
        </div>
      ` : `
        <div><label class="label">Full name</label><input class="input" id="gi-new-name" required /></div>
        <div><label class="label">Email (for reminders)</label><input class="input" id="gi-new-email" type="email" required /></div>
        <div><label class="label">Phone</label><input class="input" id="gi-new-phone" /></div>
        <div><label class="label">Assigned trainer</label>
          <select class="input" id="gi-new-trainer"><option value="">— none —</option>${trainers.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select>
        </div>
      `}

      <div><label class="label">Plan</label>
        <select class="input" id="gi-plan" required onchange="recalcInvoiceEndDate()">
          <option value="">Select plan</option>
          ${plans.map(p=>`<option value="${p.id}">${p.name} — ${fmtINR(p.price)}</option>`).join('')}
        </select>
      </div>

      <div class="grid grid-2">
        <div><label class="label">Plan start date</label>
          <input class="input" id="gi-start" type="date" value="${todayISO()}" onchange="recalcInvoiceEndDate()" required />
        </div>
        <div><label class="label">Plan end date</label>
          <input class="input" id="gi-end" type="date" />
        </div>
      </div>
      <p class="muted" style="margin-top:-6px;">Defaults to today, with the end date calculated from the plan's duration — edit either field to override.</p>

      <div style="border:1px solid var(--surface-border);border-radius:12px;padding:14px;">
        <label style="display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;cursor:pointer;">
          <input type="checkbox" id="gi-include-pt" onchange="document.getElementById('gi-pt-select-wrap').style.display=this.checked?'block':'none';" style="width:16px;height:16px;accent-color:var(--p-500);" />
          Include personal training
        </label>
        <div id="gi-pt-select-wrap" style="display:none;margin-top:10px;">
          <select class="input" id="gi-pt-plan">
            <option value="">Select PT plan</option>
            ${ptPlans.map(p=>`<option value="${p.id}">${p.name} — ${fmtINR(p.price)}</option>`).join('')}
          </select>
          ${ptPlans.length===0 ? `<p class="muted" style="margin:8px 0 0;">No PT plans set up yet — add one under Plans.</p>` : ''}
        </div>
      </div>

      <div><label class="label">Payment mode</label>
        <select class="input" id="gi-payment"><option>UPI</option><option>Bank Transfer</option><option>Cash</option><option>Card</option></select>
      </div>
      <p class="muted">GST is <b>${g.gstEnabled?'ON':'OFF'}</b> for this gym — set in Gym Settings by the super admin.</p>
      <button class="btn-primary" type="submit" id="gi-submit">Generate invoice</button>
    </form>
    <div>
      <div id="invoice-preview-slot">${state.invoicePreview ? invoicePreviewHTML() : `<div class="card" style="min-height:280px;display:flex;align-items:center;justify-content:center;"><p class="muted">Fill the form to preview the invoice.</p></div>`}</div>
    </div>
  </div>`;
}
// Auto-fills the end date from the selected plan's duration whenever the
// plan or start date changes — but only touches the end date field itself,
// so a manual edit to it afterward isn't clobbered until plan/start change again.
function recalcInvoiceEndDate(){
  const planSel = document.getElementById('gi-plan');
  const startInput = document.getElementById('gi-start');
  const endInput = document.getElementById('gi-end');
  if(!planSel || !startInput || !endInput) return;
  const plan = (state.cache.plans || []).find(p=>p.id===planSel.value);
  if(!plan || !startInput.value) return;
  const end = new Date(startInput.value);
  end.setMonth(end.getMonth() + (plan.durationMonths || 1));
  endInput.value = end.toISOString().slice(0,10);
}
function invoicePreviewHTML(){
  const inv = state.invoicePreview;

  const gstEnabled = inv.gstEnabled;
  return `
  <div class="card" style="padding:0;overflow:hidden;margin-bottom:10px;">
    <div class="invoice" id="invoice-root">
      <div class="invoice-head">
        <div style="display:flex;gap:10px;align-items:center;">
          ${g.logoUrl?`<img class="invoice-logo" src="${g.logoUrl}"/>`:''}
          <div>
            <p class="font-display" style="font-weight:700;font-size:16px;margin:0;">${g.name||''}</p>
            <small>${g.address||''}</small><br/>
            ${gstEnabled && g.gstin?`<small>GSTIN: ${g.gstin}</small><br/>`:''}
            <small>${g.phone||''}</small>
          </div>
        </div>
        <div style="text-align:right;">
          <p class="font-display" style="font-weight:700;color:var(--p-700);font-size:18px;margin:0;">${gstEnabled?'TAX INVOICE':'INVOICE'}</p>
          <small>No. ${inv.number}</small><br/><small>Date: ${formatDMY(inv.date)}</small>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:16px;">
        <div>
          <small style="display:block;margin-bottom:4px;">Billed to</small>
          <p style="font-size:14px;font-weight:500;margin:0;">${inv.member.name}</p>
          <small>${inv.member.phone||''}</small><br/><small>${inv.member.email||''}</small>
        </div>
        <div style="text-align:right;">
          <small style="display:block;margin-bottom:4px;">Membership period</small>
          <p style="font-size:14px;margin:0;">${formatDMY(inv.startDate)} → ${formatDMY(inv.expiryDate)}</p>
        </div>
      </div>
      <table>
        <thead><tr><th>Description</th>${gstEnabled?'<th>HSN</th>':''}<th style="text-align:right;">Amount</th></tr></thead>
        <tbody>
          ${inv.lineItems.map(item=>`<tr><td>${item.name}</td>${gstEnabled?`<td>${item.hsn||'999723'}</td>`:''}<td style="text-align:right;">${fmtINR(item.amount)}</td></tr>`).join('')}
        </tbody>
      </table>
      <div class="totals"><div class="totals-box">
        <div class="totals-row"><span>Subtotal</span><span>${fmtINR(inv.subtotal)}</span></div>
        ${gstEnabled?`<div class="totals-row"><span>CGST (${(inv.gstRate/2).toFixed(1)}%)</span><span>${fmtINR(inv.cgst ?? inv.gstAmount/2)}</span></div>
        <div class="totals-row"><span>SGST (${(inv.gstRate/2).toFixed(1)}%)</span><span>${fmtINR(inv.sgst ?? inv.gstAmount/2)}</span></div>`:''}
        <div class="totals-row total"><span>Total</span><span>${fmtINR(inv.total)}</span></div>
      </div></div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:#575F79;margin-bottom:16px;">
        <div><b style="color:#12172E;">Payment mode</b><br/>${inv.paymentMode}</div>
        <div style="text-align:right;">${g.upiId?`UPI: ${g.upiId}<br/>`:''}${(g.bankDetails||'').replace(/\n/g,'<br/>')}</div>
      </div>
      ${g.terms?`<div style="border-top:1px solid #E7EAF3;padding-top:12px;"><b style="font-size:12px;">Terms &amp; Conditions</b><p style="color:#8A90A6;font-size:11px;white-space:pre-line;">${g.terms}</p></div>`:''}
    </div>
  </div>
  <button class="btn-primary" id="pdf-download-btn" style="width:100%;" onclick="downloadInvoicePdf('${inv.number}')">${ICONS.download} Download PDF</button>`;
}
function downloadInvoicePdf(number){
  const node = document.getElementById('invoice-root');
  const btn = document.getElementById('pdf-download-btn');
  if(!node) return;
  if(btn) btn.textContent = 'Preparing PDF…';
  html2canvas(node, { scale:2, useCORS:true, backgroundColor:'#ffffff' }).then(canvas=>{
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','pt','a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const imgHeight = (canvas.height * pageWidth) / canvas.width;
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, pageWidth, imgHeight);
    pdf.save(`${number || 'invoice'}.pdf`);
    if(btn) btn.innerHTML = `${ICONS.download} Download PDF`;
  }).catch(()=>{
    if(btn) btn.innerHTML = `${ICONS.download} Download PDF`;
    showToast('Could not generate the PDF — try again.');
  });
}
async function handleGenerateInvoice(e){
  e.preventDefault();
  const submitBtn = document.getElementById('gi-submit');
  submitBtn.disabled = true; submitBtn.textContent = 'Generating…';

  try{
    const plans = state.cache.plans || [];
    const ptPlans = state.cache.ptPlans || [];
    const plan = plans.find(p=>p.id===document.getElementById('gi-plan').value);
    const paymentMode = document.getElementById('gi-payment').value;
    const includePt = document.getElementById('gi-include-pt').checked;
    const ptPlan = includePt ? ptPlans.find(p=>p.id===document.getElementById('gi-pt-plan').value) : null;
    if(!plan){ submitBtn.disabled=false; submitBtn.textContent='Generate invoice'; return; }

    const g = state.cache.gymSettings || {};
    // Read the (possibly manually-edited) plan dates from the form, falling
    // back to today + plan duration if either was somehow left empty.
    const start = document.getElementById('gi-start').value || todayISO();
    let expiryStr = document.getElementById('gi-end').value;
    if(!expiryStr){
      const fallback = new Date(start);
      fallback.setMonth(fallback.getMonth() + (plan.durationMonths||1));
      expiryStr = fallback.toISOString().slice(0,10);
    }

    let member;
    if(state.invoiceMode === 'new'){
      const memberDoc = {
        name: document.getElementById('gi-new-name').value,
        email: document.getElementById('gi-new-email').value,
        phone: document.getElementById('gi-new-phone').value,
        trainerId: document.getElementById('gi-new-trainer').value,
        planId: plan.id, planName: plan.name,
        startDate: start, expiryDate: expiryStr, status:'active',
      };
      member = await addDocument('members', memberDoc);
    } else {
      const members = state.cache.members || [];
      member = members.find(m=>m.id===document.getElementById('gi-member').value);
      if(!member){ submitBtn.disabled=false; submitBtn.textContent='Generate invoice'; return; }
      await updateDocument('members', member.id, {
        planId: plan.id, planName: plan.name, startDate: start, expiryDate: expiryStr, status:'active',
      });
    }

    const number = await nextInvoiceNumber();
    // The toggle alone controls whether tax is charged — GSTIN is only for
    // what's printed on the invoice. Requiring both was the bug: turning
    // GST on with GSTIN not yet filled in silently produced a zero-tax
    // invoice with no indication why.
    const gstEnabled = !!g.gstEnabled;
    const gstRate = 18;
    const lineItems = [{ name: plan.name, hsn: plan.hsn, amount: plan.price||0 }];
    if(includePt && ptPlan) lineItems.push({ name: `Personal Training — ${ptPlan.name}`, hsn: ptPlan.hsn, amount: ptPlan.price||0 });
    const subtotal = lineItems.reduce((s,i)=>s+i.amount,0);
    const gstAmount = gstEnabled ? +(subtotal*(gstRate/100)).toFixed(2) : 0;
    // Split for GSTR-1: assumes intra-state supply (CGST+SGST), the normal
    // case for a single-location gym. If you ever bill an out-of-state
    // member, that invoice's split isn't correct for IGST — handle those
    // separately in your filing.
    const cgst = +(gstAmount/2).toFixed(2);
    const sgst = +(gstAmount - cgst).toFixed(2);
    const total = subtotal + gstAmount;

    const invoiceDoc = {
      number, date: start, memberId: member.id, memberName: member.name,
      planId: plan.id, planName: plan.name,
      ptPlanId: includePt && ptPlan ? ptPlan.id : null,
      ptPlanName: includePt && ptPlan ? ptPlan.name : null,
      startDate: start, expiryDate: expiryStr,
      lineItems, amount: subtotal, gstEnabled, gstRate, gstAmount, cgst, sgst, total,
      paymentMode, raisedBy: state.profile.name,
    };
    const savedInvoice = await addDocument('invoices', invoiceDoc);

    state.invoicePreview = { ...savedInvoice, member, subtotal };
    showToast(state.invoiceMode==='new' ? 'Invoice generated and member added.' : 'Invoice generated and membership renewed.');
    state.invoiceMode = 'existing';
    await loadRoute();
  } finally {
    submitBtn.disabled = false; submitBtn.textContent = 'Generate invoice';
  }
}

function viewTrainerMembers(){
  const mine = state.cache.myMembers || [];
  const columns = [
    { key:'name', label:'Name', sortable:true, render:(m)=>`<div><p style="margin:0;font-weight:500;">${m.name}</p><p class="muted" style="margin:0;">${m.phone||''}</p></div>` },
    { key:'planName', label:'Plan', sortable:true, render:(m)=>m.planName||'—' },

/* ---------------- Router / render ----------------
   Split in two on purpose:
   - render()     : SYNC, redraws from whatever is already in state.cache.
                    Use this for pure UI state (toggles, search/sort/page,
                    theme, an in-progress form edit) — it never touches
                    storage, so it can never wipe an unsaved edit.
   - loadRoute()  : ASYNC, re-fetches the current route's data then calls
                    render(). Use this after navigating, logging in, or
                    after a save/add/delete that changed the backend data.
*/
function navigate(route){ state.route = route; state.mobileOpen = false; state.invoicePreview = null; loadRoute(); }

function render(){
  applyTheme();
  const app = document.getElementById('app');

  if(!state.authResolved){
    app.innerHTML = `<div class="spinner-wrap">Loading…</div>`;
    return;
  }
  if(!state.currentUser){
    app.innerHTML = state.needsBootstrap ? viewBootstrap() : viewLogin();
    return;
  }

  let body = '';
  switch(state.route){
    case 'admin/summary': body = viewAdminSummary(); break;
    case 'admin/members': body = viewMembers(true); break;
    case 'admin/sales': body = viewSalesFunnel(); break;
    case 'admin/invoices': body = viewAdminInvoices(); break;
    case 'admin/plans': body = viewPlans(); break;
    case 'admin/users': body = viewUsers(); break;
    case 'admin/settings': body = viewGymSettings(); break;
    case 'staff/dashboard': body = viewStaffDashboard(); break;
    case 'staff/members': body = viewMembers(true); break;
    case 'staff/invoices': body = viewGenerateInvoice(); break;
    case 'staff/sales': body = viewSalesFunnel(); break;
    case 'trainer/dashboard': body = viewTrainerDashboard(); break;
    case 'trainer/members': body = viewTrainerMembers(); break;
    default: body = '<p>Not found.</p>';
  }
  app.innerHTML = shellWrap(body);

  if(state.route === 'admin/summary'){
    const chartData = buildChartData(state.cache.invoices||[], state.cache.members||[], state.cache.users||[]);
    requestAnimationFrame(() => initSummaryCharts(chartData));
  }
  if(state.route === 'staff/invoices'){
    requestAnimationFrame(recalcInvoiceEndDate);
  }
}

async function loadRoute(){
  applyTheme();
  const app = document.getElementById('app');
  if(!state.authResolved){ render(); return; }
  if(!state.currentUser){ render(); return; }
  app.innerHTML = shellWrap(`<div class="spinner-wrap" style="min-height:40vh;">Loading…</div>`);
  await loadAllFor(state.route);
  render();
}
</script>
